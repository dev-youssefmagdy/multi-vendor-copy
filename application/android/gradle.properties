org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# ===== Android app identity: THE ONE PLACE TO CHANGE (see docs/mobile/DEEPLINKS.md) =====
# PLACEHOLDERS - replace before any real build / Play submission.
# Must equal MOBILE_ANDROID_PACKAGE on the backend.
app.applicationId=com.yourcompany.storeapp
# Platform domain: tenant subdomains <store>.<this> are verified App Links hosts (wildcard).
app.platformDomain=platform.example.com
# Must equal MOBILE_DEEP_LINK_SCHEME on the backend.
app.urlScheme=storeapp
