# White-label Android builds (one app per tenant). See docs/mobile/WHITE_LABEL_BUILDS.md and
# application/PUBLISH_TO_STORES.md §5, §8, §11.
#
# Secrets live in one GitHub Environment per tenant: tenant-<id>-android (name from tenant.json
# android.secretsEnvironment). Give each environment required reviewers.
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   PLAY_SERVICE_ACCOUNT_JSON_BASE64   versionCode lookup (latest on Play + 1) and action=upload_internal.
#                                      Without it, a build needs an explicit build_number (e.g. the first upload).
# Repository variable: PLATFORM_API_BASE (https origin of the central API; not a secret).
#
# Nothing here releases to production. upload_internal sends the AAB to the Play *internal testing*
# track; promotion to production is a manual step by the tenant in Play Console.
name: android-tenant-release

on:
  workflow_dispatch:
    inputs:
      tenant:
        description: 'Tenant id, comma-separated ids, or "all" (all enabled Android tenants)'
        required: true
        default: all
      action:
        description: build = signed artifact only; upload_internal = also upload to the Play internal track
        type: choice
        options: [build, upload_internal]
        default: build
      artifact:
        description: aab for Play, apk for side-loading testers
        type: choice
        options: [aab, apk]
        default: aab
      build_number:
        description: versionCode override (empty = highest on Play + 1). Must be higher than Play's latest.
        required: false
        default: ''
      release_status:
        description: Play release status on the internal track (apps never published need draft)
        type: choice
        options: [completed, draft]
        default: completed

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.1
  TB: dart run tool/tenant_builder/bin/tenant_builder.dart

defaults:
  run:
    working-directory: application

jobs:
  checks:
    name: Checks + tenant matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format (tenant tooling)
        run: dart format --output=none --set-exit-if-changed tool test/tool test/unit/white_label_test.dart
      - run: flutter analyze
      - run: flutter test
      - name: Validate all tenants
        run: $TB validate --all --platform android
      - name: Generation is idempotent
        run: |
          $TB generate --all --platform android
          $TB generate --all --platform android --check
      - name: Plan tenant matrix
        id: plan
        env:
          TENANT_INPUT: ${{ inputs.tenant }}
        run: |
          set -euo pipefail
          $TB list --json --enabled --platform android > "$RUNNER_TEMP/tenants.json"
          if [ "$TENANT_INPUT" = "all" ]; then
            matrix=$(jq -c '[.[] | {id, environment}]' "$RUNNER_TEMP/tenants.json")
          else
            matrix='[]'
            IFS=',' read -ra WANT <<< "$TENANT_INPUT"
            for raw in "${WANT[@]}"; do
              id="$(echo "$raw" | tr -d '[:space:]')"
              [ -z "$id" ] && continue
              row=$(jq -c --arg id "$id" '[.[] | select(.id == $id) | {id, environment}]' "$RUNNER_TEMP/tenants.json")
              if [ "$row" = "[]" ]; then
                echo "::error::Tenant '$id' is not registered, not enabled, or has Android disabled"
                exit 1
              fi
              matrix=$(jq -c --argjson a "$matrix" --argjson b "$row" -n '$a + $b | unique_by(.id)')
            done
          fi
          if [ "$matrix" = "[]" ]; then echo "::error::No tenant selected"; exit 1; fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Tenants: $matrix"

  release:
    name: ${{ matrix.id }}
    needs: checks
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false   # one tenant's failure (e.g. missing key) must not block the others
      matrix:
        include: ${{ fromJSON(needs.checks.outputs.matrix) }}
    environment: ${{ matrix.environment }}
    concurrency:
      group: release-android-${{ matrix.id }}
      cancel-in-progress: false
    env:
      TENANT: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Install upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set in environment tenant-$TENANT-android"
            exit 1
          fi
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Set up Ruby (fastlane, application/Gemfile)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: application

      - name: Play service account (versionCode lookup / upload)
        env:
          PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${PLAY_SERVICE_ACCOUNT_JSON_BASE64:-}" ]; then
            echo "::warning::PLAY_SERVICE_ACCOUNT_JSON_BASE64 is not set in tenant-$TENANT-android: the build needs build_number"
            exit 0
          fi
          umask 077
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON_BASE64" | base64 -d > "$RUNNER_TEMP/play.json"
          echo "PLAY_SERVICE_ACCOUNT_JSON_PATH=$RUNNER_TEMP/play.json" >> "$GITHUB_ENV"

      - name: Build + verify (validate --release, versionCode lookup, build)
        env:
          ANDROID_SIGNING_TENANT: ${{ matrix.id }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLATFORM_API_BASE: ${{ vars.PLATFORM_API_BASE }}
          ARTIFACT: ${{ inputs.artifact }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          args=(build --tenant "$TENANT" --platform android --artifact "$ARTIFACT" --mode release)
          if [ -n "$BUILD_NUMBER" ]; then args+=(--build-number "$BUILD_NUMBER"); fi
          $TB "${args[@]}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.id }}-${{ github.run_number }}
          path: application/dist/${{ matrix.id }}/android/
          if-no-files-found: error
          retention-days: 30

      - name: Upload to Play internal testing
        if: inputs.action == 'upload_internal'
        env:
          RELEASE_STATUS: ${{ inputs.release_status }}
          ARTIFACT: ${{ inputs.artifact }}
        run: |
          set -euo pipefail
          if [ "$ARTIFACT" != "aab" ]; then echo "::error::Play uploads need artifact=aab"; exit 1; fi
          if [ -z "${PLAY_SERVICE_ACCOUNT_JSON_PATH:-}" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON_BASE64 is not set in environment tenant-$TENANT-android"
            exit 1
          fi
          $TB upload --tenant "$TENANT" --platform android --track internal --release-status "$RELEASE_STATUS"

      - name: Job summary
        if: always()
        run: |
          info="dist/$TENANT/android/build-info.json"
          if [ -f "$info" ]; then
            jq -r '"| \(.tenant) | \(.applicationId) | \(.versionName) (\(.versionCode)) | \(.artifact) | \(.gitCommit[0:8]) |"' "$info" \
              | { echo "| tenant | package | version | artifact | commit |"; echo "|---|---|---|---|---|"; cat; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| $TENANT | build failed | | | |" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/play.json"
