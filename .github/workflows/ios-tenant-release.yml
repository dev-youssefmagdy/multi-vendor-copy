# White-label iOS builds (one app per tenant). See docs/mobile/WHITE_LABEL_BUILDS.md and
# application/PUBLISH_TO_STORES.md §6, §8, §11.
#
# Secrets live in one GitHub Environment per tenant: tenant-<id>-ios (name from tenant.json
# ios.secretsEnvironment). Give each environment required reviewers. Only that tenant's values:
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY_P8_BASE64   App Store Connect API key (App Manager)
#   MATCH_GIT_URL, MATCH_PASSWORD, MATCH_GIT_SSH_KEY       the tenant's own match storage (read-only)
# Repository variables (not secrets): PLATFORM_API_BASE, optional IOS_RUNNER_LABEL / IOS_XCODE_VERSION.
#
# Nothing here submits for App Review or releases. upload_testflight uploads the verified IPA to the
# tenant's TestFlight; review submission and release are manual steps of the tenant in App Store Connect.
name: ios-tenant-release

on:
  workflow_dispatch:
    inputs:
      tenant:
        description: 'Tenant id, comma-separated ids, or "all" (all enabled iOS tenants)'
        required: true
        default: all
      action:
        description: build = signed IPA artifact only; upload_testflight = also upload to the tenant's TestFlight
        type: choice
        options: [build, upload_testflight]
        default: build
      build_number:
        description: CFBundleVersion override (empty = store latest + 1). Must be higher than the latest upload.
        required: false
        default: ''
      marketing_version:
        description: CFBundleShortVersionString override (empty = pubspec.yaml version)
        required: false
        default: ''

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.1
  # Apple requires the iOS 26 SDK (Xcode 26) for uploads. Pinned; change deliberately after checking
  # https://github.com/actions/runner-images (the select step lists what the image has).
  XCODE_VERSION: ${{ vars.IOS_XCODE_VERSION || '26.2' }}
  TB: dart run tool/tenant_builder/bin/tenant_builder.dart

defaults:
  run:
    working-directory: application

jobs:
  checks:
    name: Checks + tenant matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format (tenant tooling)
        run: dart format --output=none --set-exit-if-changed tool test/tool test/unit/white_label_test.dart
      - run: flutter analyze
      - run: flutter test
      - name: Validate all tenants
        run: $TB validate --all --platform ios
      - name: Generation is idempotent
        run: |
          $TB generate --all --platform ios
          $TB generate --all --platform ios --check
      - name: Plan tenant matrix
        id: plan
        env:
          TENANT_INPUT: ${{ inputs.tenant }}
        run: |
          set -euo pipefail
          $TB list --json --enabled --platform ios > "$RUNNER_TEMP/tenants.json"
          if [ "$TENANT_INPUT" = "all" ]; then
            matrix=$(jq -c '[.[] | {id, environment}]' "$RUNNER_TEMP/tenants.json")
          else
            matrix='[]'
            IFS=',' read -ra WANT <<< "$TENANT_INPUT"
            for raw in "${WANT[@]}"; do
              id="$(echo "$raw" | tr -d '[:space:]')"
              [ -z "$id" ] && continue
              row=$(jq -c --arg id "$id" '[.[] | select(.id == $id) | {id, environment}]' "$RUNNER_TEMP/tenants.json")
              if [ "$row" = "[]" ]; then
                echo "::error::Tenant '$id' is not registered, not enabled, or has iOS disabled"
                exit 1
              fi
              matrix=$(jq -c --argjson a "$matrix" --argjson b "$row" -n '$a + $b | unique_by(.id)')
            done
          fi
          if [ "$matrix" = "[]" ]; then echo "::error::No tenant selected"; exit 1; fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Tenants: $matrix"

  release:
    name: ${{ matrix.id }}
    needs: checks
    runs-on: ${{ vars.IOS_RUNNER_LABEL || 'macos-26' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false   # one tenant's failure (e.g. expired certificate) must not block the others
      matrix:
        include: ${{ fromJSON(needs.checks.outputs.matrix) }}
    environment: ${{ matrix.environment }}
    concurrency:
      # One job per tenant app at a time: build-number allocation and signing are not raced.
      group: release-ios-${{ matrix.id }}
      cancel-in-progress: false
    env:
      TENANT: ${{ matrix.id }}
      IOS_SIGNING_TENANT: ${{ matrix.id }}
      PLATFORM_API_BASE: ${{ vars.PLATFORM_API_BASE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          set -euo pipefail
          app="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$app" ]; then
            echo "::error::$app is not on this runner image. Installed:"; ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -s "$app/Contents/Developer"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: application

      - name: Toolchain versions
        run: |
          xcodebuild -version
          flutter --version
          ruby --version
          bundle --version
          bundle exec fastlane --version | tail -1
          echo "CocoaPods: $(pod --version 2>/dev/null || echo 'not used (Swift Package Manager)')"

      - run: flutter pub get

      - name: Validate (release gate, before any credential is used)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_P8_BASE64: ${{ secrets.ASC_PRIVATE_KEY_P8_BASE64 }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: $TB validate --tenant "$TENANT" --platform ios --release

      - name: Temporary keychain
        run: |
          set -euo pipefail
          name="tb-${GITHUB_RUN_ID}-$(openssl rand -hex 8).keychain-db"
          pw="$(openssl rand -base64 32)"
          echo "::add-mask::$pw"
          security create-keychain -p "$pw" "$name"
          security set-keychain-settings -lut 21600 "$name"
          security unlock-keychain -p "$pw" "$name"
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$name" $(security list-keychains -d user | tr -d '"')
          echo "MATCH_KEYCHAIN_NAME=$name" >> "$GITHUB_ENV"
          echo "MATCH_KEYCHAIN_PASSWORD=$pw" >> "$GITHUB_ENV"

      - name: Match storage access (SSH deploy key)
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_SSH_KEY: ${{ secrets.MATCH_GIT_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MATCH_GIT_SSH_KEY:-}" ]; then echo "No MATCH_GIT_SSH_KEY (https match storage?)"; exit 0; fi
          eval "$(ssh-agent -s)" > /dev/null
          printf '%s\n' "$MATCH_GIT_SSH_KEY" | ssh-add - > /dev/null
          host="$(printf '%s' "$MATCH_GIT_URL" | sed -E 's#^(ssh://)?([^@]+@)?([^:/]+).*#\3#')"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -t ed25519,rsa "$host" >> ~/.ssh/known_hosts 2> /dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Build + verify (build-number lookup, match read-only, flutter build ipa, IPA checks)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_P8_BASE64: ${{ secrets.ASC_PRIVATE_KEY_P8_BASE64 }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          BUILD_NAME: ${{ inputs.marketing_version }}
        run: |
          set -euo pipefail
          args=(build --tenant "$TENANT" --platform ios --artifact ipa --mode release)
          if [ -n "$BUILD_NUMBER" ]; then args+=(--build-number "$BUILD_NUMBER"); fi
          if [ -n "$BUILD_NAME" ]; then args+=(--build-name "$BUILD_NAME"); fi
          $TB "${args[@]}"

      - name: Upload artifact (IPA + build-info.json; no signing material)
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ matrix.id }}-${{ github.run_number }}
          path: application/dist/${{ matrix.id }}/ios/
          if-no-files-found: error
          retention-days: 30

      - name: Upload to TestFlight (no review submission, no release)
        id: testflight
        if: inputs.action == 'upload_testflight'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_P8_BASE64: ${{ secrets.ASC_PRIVATE_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          $TB upload --tenant "$TENANT" --platform ios --destination testflight
          echo "uploaded=yes" >> "$GITHUB_OUTPUT"

      - name: Job summary
        if: always()
        env:
          UPLOADED: ${{ steps.testflight.outputs.uploaded == 'yes' && 'TestFlight (processing)' || (inputs.action == 'upload_testflight' && 'FAILED' || 'not requested') }}
        run: |
          info="dist/$TENANT/ios/build-info.json"
          {
            echo "| tenant | bundle id | version (build) | artifact | commit | upload |"
            echo "|---|---|---|---|---|---|"
            if [ -f "$info" ]; then
              jq -r --arg up "$UPLOADED" '"| \(.tenant) | \(.bundleId) | \(.versionName) (\(.buildNumber)) | \(.artifact) | \((.gitCommit // "")[0:8]) | \($up) |"' "$info"
            else
              echo "| $TENANT | build failed | | | | |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up signing material and workspace
        if: always()
        run: |
          if [ -n "${MATCH_KEYCHAIN_NAME:-}" ]; then security delete-keychain "$MATCH_KEYCHAIN_NAME" || true; fi
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision || true
          rm -rf ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles || true
          if [ -n "${SSH_AGENT_PID:-}" ]; then ssh-agent -k > /dev/null || true; fi
          rm -rf "build/workspaces/$TENANT" || true
