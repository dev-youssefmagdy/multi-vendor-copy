<VirtualHost *:80>
    ServerName yourdomain.com
    ServerAlias *.yourdomain.com
    DocumentRoot /var/www/multi-vendor/public

    <Directory /var/www/multi-vendor/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    # PHP 8.3 via FPM socket
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
    </FilesMatch>

    # Python FastAPI reverse proxy (optional — uncomment to expose via /python-api/)
    # ProxyPass /python-api/ http://127.0.0.1:8001/
    # ProxyPassReverse /python-api/ http://127.0.0.1:8001/

    # Security headers
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/multi-vendor-error.log
    CustomLog ${APACHE_LOG_DIR}/multi-vendor-access.log combined
</VirtualHost>

# HTTPS block is added automatically by certbot.
# After running: sudo certbot --apache -d yourdomain.com -d "*.yourdomain.com"
# certbot will append the SSL VirtualHost here.
